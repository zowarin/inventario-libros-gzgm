<section class="mx-auto max-w-2xl p-6">
  <header class="mb-6 flex items-center justify-between gap-4">
    <h1 class="text-2xl font-semibold text-gray-900">
      {{ isEditMode() ? 'Editar libro' : 'Nuevo libro' }}
    </h1>
    <a routerLink="/" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">
      ← Volver al listado
    </a>
  </header>

  @if (formError(); as errorMsg) {
    <div class="mb-4 rounded-md border border-red-300 bg-red-50 p-4 text-sm text-red-700" role="alert">
      {{ errorMsg }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label for="titulo" class="block text-sm font-medium text-gray-700">Título *</label>
      <input
        id="titulo"
        type="text"
        formControlName="titulo"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline focus:outline-2 focus:outline-indigo-500"
      />
      @if (form.controls.titulo.invalid && form.controls.titulo.touched) {
        <p class="mt-1 text-sm text-red-600">El título es obligatorio.</p>
      }
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="album" class="block text-sm font-medium text-gray-700">Caja / Álbum</label>
        <input
          id="album"
          type="text"
          formControlName="album"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline focus:outline-2 focus:outline-indigo-500"
        />
      </div>
      <div>
        <label for="carpeta" class="block text-sm font-medium text-gray-700">Carpeta</label>
        <input
          id="carpeta"
          type="text"
          formControlName="carpeta"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline focus:outline-2 focus:outline-indigo-500"
        />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="archivo" class="block text-sm font-medium text-gray-700">Archivo</label>
        <input
          id="archivo"
          type="text"
          formControlName="archivo"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline focus:outline-2 focus:outline-indigo-500"
        />
      </div>
      <div>
        <label for="portada" class="block text-sm font-medium text-gray-700">Ruta de portada</label>
        <input
          id="portada"
          type="text"
          formControlName="portada"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline focus:outline-2 focus:outline-indigo-500"
        />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="rotacion" class="block text-sm font-medium text-gray-700">Rotación</label>
        <input
          id="rotacion"
          type="number"
          formControlName="rotacion"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline focus:outline-2 focus:outline-indigo-500"
        />
      </div>
      <div>
        <label for="titulo_confianza" class="block text-sm font-medium text-gray-700">Confianza del título</label>
        <input
          id="titulo_confianza"
          type="number"
          step="0.1"
          formControlName="titulo_confianza"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline focus:outline-2 focus:outline-indigo-500"
        />
      </div>
    </div>

    <div>
      <label for="url_origen" class="block text-sm font-medium text-gray-700">URL de origen</label>
      <input
        id="url_origen"
        type="text"
        formControlName="url_origen"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline focus:outline-2 focus:outline-indigo-500"
      />
    </div>

    <div>
      <label for="texto_ocr" class="block text-sm font-medium text-gray-700">Texto OCR</label>
      <textarea
        id="texto_ocr"
        rows="4"
        formControlName="texto_ocr"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline focus:outline-2 focus:outline-indigo-500"
      ></textarea>
    </div>

    <div class="flex items-center justify-between gap-3 pt-2">
      @if (isEditMode()) {
        <button
          type="button"
          [disabled]="deleting()"
          class="rounded-md border border-red-300 px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 disabled:opacity-50"
          (click)="onDelete()"
        >
          {{ deleting() ? 'Eliminando…' : 'Eliminar' }}
        </button>
      } @else {
        <span></span>
      }

      <div class="flex gap-3">
        <a
          routerLink="/"
          class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
        >
          Cancelar
        </a>
        <button
          type="submit"
          [disabled]="saving()"
          class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500 disabled:opacity-50"
        >
          {{ saving() ? 'Guardando…' : 'Guardar' }}
        </button>
      </div>
    </div>
  </form>
</section>
