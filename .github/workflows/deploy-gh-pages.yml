name: Deploy front-invetario-ng to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'front-invetario-ng/**'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-invetario-ng
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-invetario-ng/package-lock.json

      - run: npm ci

      - run: npx ng build --configuration production --base-href /inventario-libros-gzgm/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: front-invetario-ng/dist/front-invetario-ng/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
